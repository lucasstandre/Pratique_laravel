name: CI 2

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: Linter (Laravel Pint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo, pdo_mysql, mbstring, bcmath, zip

      - name: Installer les dépendances
        run: composer install --no-interaction --prefer-dist

      - name: Vérifier le formatage avec Pint
        run: ./vendor/bin/pint --test

  analyse:
    name: Analyse statique (PHPStan)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo, pdo_mysql, mbstring, bcmath, zip

      - name: Installer les dépendances
        run: composer install --no-interaction --prefer-dist

      - name: Analyse statique PHPStan
        run: ./vendor/bin/phpstan analyse --no-progress --memory-limit=512M

  audit:
    name: Audit des dépendances (Composer Audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo, pdo_mysql, mbstring, bcmath, zip

      - name: Installer les dépendances
        run: composer install --no-interaction --prefer-dist

      - name: Audit des dependances
        continue-on-error: true # continue si ya pas de wifi (merge dans le main)
        run: composer audit --abandoned=ignore --ignore-severity=low,moderate # pour ignorer lerreur

  enlightn:
    name: Audit de l'application (Enlightn)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo, pdo_mysql, mbstring, bcmath, zip

      - name: Installer les dépendances
        run: composer install --no-interaction --prefer-dist

      - name: Installer Enlightn
        run: composer require enlightn/enlightn --dev -W --no-interaction

      - name: Préparer l'environnement
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Lancement d'Enlightn
        continue-on-error: true
        run: php artisan enlightn

